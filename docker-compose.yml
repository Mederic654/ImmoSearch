services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: immosearch-app
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www/html
    environment:
      APP_ENV: dev
      APP_DEBUG: 1
      DATABASE_URL: "mysql://immo:immo@database:3306/immosearch?serverVersion=10.11.2-MariaDB&charset=utf8mb4"
    depends_on:
      database:
        condition: service_healthy
    networks:
      - immo-net

  database:
    image: mariadb:10.11
    container_name: immosearch-db
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_DATABASE: immosearch
      MARIADB_USER: immo
      MARIADB_PASSWORD: immo
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - immo-net

volumes:
  db_data:

networks:
  immo-net:
